<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>skua terminal</title>
        <link rel="icon" href="/bird.svg" type="image/svg+xml" />
        <script>
            (function () {
                try {
                    var saved = localStorage.getItem("skua-theme");
                    if (saved === "dark" || saved === "light") {
                        document.documentElement.dataset.theme = saved;
                        return;
                    }
                } catch (e) {}
                if (
                    window.matchMedia &&
                    window.matchMedia("(prefers-color-scheme: dark)").matches
                ) {
                    document.documentElement.dataset.theme = "dark";
                }
            })();
        </script>
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <body class="terminal-page">
        <!-- skua:navbar active="terminal" -->
        <main class="terminal-page">
            <aside class="term-sidebar">
                <div class="term-toolbar">
                    <button type="button" id="term-new" class="term-btn" title="New terminal">
                        <span class="term-new-icon" aria-hidden="true">+</span>
                        <span class="term-new-text">Term</span>
                    </button>
                    <button type="button" id="term-search-new" class="term-btn term-search-btn" title="New project search (⌘⇧F)" aria-label="New project search">
                        <span class="term-search-icon" aria-hidden="true">⌕</span>
                    </button>
                    <button
                        type="button"
                        id="term-utils-toggle"
                        class="term-tool-btn term-utils-toggle"
                        title="Utilities"
                        aria-label="Utilities"
                        aria-haspopup="true"
                        aria-expanded="false"
                        aria-controls="term-utils"
                    >
                        <span class="term-utils-caret" aria-hidden="true">⌄</span>
                    </button>
                    <button
                        type="button"
                        id="term-collapse"
                        class="term-tool-btn term-collapse"
                        title="Collapse sidebar"
                        aria-label="Collapse sidebar"
                    >
                        <span class="term-collapse-icon" aria-hidden="true">‹</span>
                    </button>
                </div>
                <div class="term-utils" id="term-utils" hidden>
                    <form id="term-cwd-form" class="term-cwd-form">
                        <input
                            type="text"
                            id="term-cwd"
                            name="cwd"
                            autocomplete="off"
                            spellcheck="false"
                            placeholder="~ default dir"
                        />
                        <button type="submit" class="term-btn">save</button>
                    </form>
                    <!-- The Terminal / Claude tips buttons that used to sit here
                         are now the Neovim / Terminal / Claude tabs of the
                         shared help (?) modal in the navbar. The "saved ✓" tag
                         confirms the cwd write, so it tracks the form above it. -->
                    <div class="term-utils-row">
                        <span id="term-cwd-saved" class="term-cwd-saved" hidden>saved ✓</span>
                    </div>
                    <div class="term-bar-row3">
                        <label class="term-scheme-label" for="term-scheme">theme</label>
                        <select
                            id="term-scheme"
                            class="term-scheme-select"
                            title="Terminal color scheme"
                        ></select>
                    </div>
                    <p id="term-bar-error" class="term-error" hidden></p>
                </div>
                <ul id="term-list" class="term-list"></ul>
            </aside>
            <div
                id="term-resizer"
                class="term-resizer"
                role="separator"
                aria-orientation="vertical"
                aria-label="Resize terminal sidebar"
                title="Drag to resize · double-click to reset"
                tabindex="0"
            ></div>
            <section class="term-stage" id="term-stage">
                <div class="term-empty" id="term-empty">
                    <p>No terminals open.</p>
                    <p class="term-empty-hint">
                        Click <strong>+ Terminal</strong> to open a shell, then run
                        <code>claude</code>.
                    </p>
                </div>
            </section>
        </main>

        <!-- skua:howto-modal -->

        <!-- Scheme registry (classic, runs before the deferred modules) so
             terminal.js can read the {id,label} list to build the picker. -->
        <script src="/terminal-schemes.js"></script>
        <script type="module" src="/terminal.js"></script>
        <script type="module" src="/components/navbar-search.js"></script>
        <script type="module" src="/components/theme.js"></script>
        <script type="module" src="/components/howto.js"></script>
    </body>
</html>
