<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>skua terminal</title>
        <!-- Scheme registry must load before the bootstrap (which reads it) and
             before terminal-xterm.js (which applies it). Classic script. -->
        <script src="/terminal-schemes.js"></script>
        <!-- Background bootstrap: paint the page in the active scheme's surface
             colour before xterm mounts, so the framed terminal isn't a flash of
             the wrong colour. The #term padding reveals this background behind
             the canvas. Same-origin as the dashboard, so the `storage` event
             (terminal-xterm.js) keeps it in sync when the scheme changes. -->
        <script>
            (function () {
                try {
                    var id = window.skuaTermScheme(
                        localStorage.getItem(window.SKUA_TERM_SCHEME_KEY),
                    );
                    document.documentElement.style.background =
                        window.SKUA_TERM_SCHEMES[id].theme.background;
                } catch (e) {}
            })();
        </script>
        <link rel="stylesheet" href="/vendor/xterm.css" />
        <style>
            /* html carries the scheme background (set by the bootstrap above and
               kept current by terminal-xterm.js); body stays transparent so the
               #term inset gap reveals that single source of truth. */
            html,
            body {
                margin: 0;
                height: 100%;
            }
            #term {
                /* Gap via inset, NOT padding: the FitAddon reads this element's
                   computed height, which Chrome reports as the border-box — with
                   padding here the row count is computed 8px too tall and the
                   bottom row clips whenever height % cellHeight < 8px. */
                position: absolute;
                inset: 4px 6px;
            }
            .xterm {
                height: 100%;
            }
            /* New-tab affordance, parked on the zellij tab-bar row.
               The tab-bar is a WASM plugin painting terminal cells, so a real
               button cannot be added *inside* it — this is a DOM overlay pinned
               to the right of that row, where tab names (which grow from the
               left) will not reach it. Colors come from the active xterm scheme
               via --term-fg/--term-bg, set in applyScheme(). */
            #term-newtab {
                position: absolute;
                top: 4px;
                right: 6px;
                z-index: 5;
                width: 20px;
                height: 18px;
                padding: 0;
                border: 0;
                border-radius: 4px;
                background: transparent;
                color: var(--term-fg, #888);
                opacity: 0.45;
                font: inherit;
                font-size: 14px;
                line-height: 1;
                cursor: pointer;
                transition: opacity 0.12s ease, background-color 0.12s ease;
            }
            #term-newtab:hover,
            #term-newtab:focus-visible {
                opacity: 1;
                background: color-mix(in srgb, var(--term-fg, #888) 18%, transparent);
            }
            #term-newtab[hidden] {
                display: none;
            }
        </style>
    </head>
    <body>
        <div id="term"></div>
        <button
            id="term-newtab"
            type="button"
            title="New zellij tab (Ctrl-a c)"
            aria-label="New zellij tab"
            hidden
        >
            +
        </button>
        <!-- UMD globals must load before the client: xterm.js → `Terminal`,
             addon-fit.js → `FitAddon.FitAddon`. Classic scripts, in order.
             No renderer addon is loaded, so xterm uses its built-in DOM
             renderer (correct cell clearing; no canvas texture-atlas staleness). -->
        <script src="/vendor/xterm.js"></script>
        <script src="/vendor/addon-fit.js"></script>
        <script src="/terminal-xterm.js"></script>
    </body>
</html>
